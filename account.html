<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#e5006d"
    >

    <title>BAZVOR — My Account</title>

    <link
        rel="stylesheet"
        href="account.css"
    >

</head>


<body>


<!-- =====================================================
     PAGE
===================================================== -->

<div class="account-page">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="account-header">

        <div class="header-left">

            <button
                class="back-btn"
                id="backBtn"
                aria-label="Go Back"
            >

                <svg viewBox="0 0 24 24">
                    <path
                        d="M15 18l-6-6 6-6"
                    />
                </svg>

            </button>

            <div class="header-logo">

                <span class="logo-icon">

                    <svg viewBox="0 0 24 24">
                        <path
                            d="M6 9V7a6 6 0 0112 0v2"
                        />
                        <path
                            d="M4 9h16v11H4z"
                        />
                        <path
                            d="M9 9v3a3 3 0 006 0V9"
                        />
                    </svg>

                </span>

                <span>BAZVOR</span>

            </div>

        </div>


        <button
            class="settings-btn"
            id="settingsBtn"
            aria-label="Settings"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"
                />

                <path
                    d="M19.4 15a1.7 1.7 0 00.34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 00-1.88-.34 1.7 1.7 0 00-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 00-1.03-1.56 1.7 1.7 0 00-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 008.4 15a1.7 1.7 0 00-1.56-1.03H6v-2.4h.84A1.7 1.7 0 008.4 10a1.7 1.7 0 00-.34-1.88L8 8.06l1.7-1.7.06.06a1.7 1.7 0 001.88.34A1.7 1.7 0 0012.67 5.2V5h2.4v.2a1.7 1.7 0 001.03 1.56 1.7 1.7 0 001.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0019.4 10a1.7 1.7 0 001.56 1.03h.84v2.4h-.84A1.7 1.7 0 0019.4 15z"
                />

            </svg>

        </button>

    </header>



    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="account-content">


        <!-- =============================================
             PROFILE CARD
        ============================================== -->

        <section class="profile-card">


            <div class="profile-avatar">

                <img
                    id="profileImage"
                    src=""
                    alt="Profile"
                >

                <div
                    class="avatar-placeholder"
                    id="avatarPlaceholder"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M20 21a8 8 0 00-16 0"
                        />

                        <circle
                            cx="12"
                            cy="7"
                            r="4"
                        />

                    </svg>

                </div>


                <button
                    class="camera-btn"
                    id="cameraBtn"
                    aria-label="Change profile photo"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 7h3l2-2h6l2 2h3v11H4z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3.2"
                        />

                    </svg>

                </button>

                <input
                    type="file"
                    id="profileInput"
                    accept="image/*"
                    hidden
                >

            </div>



            <div class="profile-info">

                <div class="profile-name-row">

                    <h1 id="profileName">
                        Md Faruk Islam
                    </h1>

                    <span class="verified-badge">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 2l2.1 2.1 3-.1.9 2.9 2.5 1.6-1.1 2.8 1.1 2.8-2.5 1.6-.9 2.9-3-.1L12 22l-2.1-2.1-3 .1-.9-2.9-2.5-1.6 1.1-2.8-1.1-2.8L6 8.5l.9-2.9 3 .1z"
                            />

                            <path
                                d="M8.5 12l2.2 2.2 4.8-5"
                            />

                        </svg>

                    </span>

                </div>


                <div class="profile-detail">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M6.5 3h3L11 7.5l-2 1.5a15 15 0 006 6l1.5-2 4.5 1.5v3a2 2 0 01-2 2C11.3 19.5 4.5 12.7 4.5 4a2 2 0 012-1z"
                        />

                    </svg>

                    <span id="profilePhone">
                        +880 1712 345678
                    </span>

                </div>


                <div class="profile-detail">

                    <svg viewBox="0 0 24 24">

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        />

                        <path
                            d="M3 7l9 6 9-6"
                        />

                    </svg>

                    <span id="profileEmail">
                        farukislam@gmail.com
                    </span>

                </div>


                <button
                    class="edit-profile-btn"
                    id="editProfileBtn"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 20h4L19 9l-4-4L4 16v4z"
                        />

                        <path
                            d="M13.5 6.5l4 4"
                        />

                    </svg>

                    <span>Edit Profile</span>

                </button>

            </div>


            <button
                class="profile-arrow"
                aria-label="Open profile"
            >

                <svg viewBox="0 0 24 24">

                    <path d="M9 18l6-6-6-6"/>

                </svg>

            </button>

        </section>



        <!-- =============================================
             QUICK STATS
        ============================================== -->

        <section class="quick-stats">


            <button
                class="stat-card"
                data-action="orders"
            >

                <span class="stat-icon">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M5 7h14v13H5z"
                        />

                        <path
                            d="M8 7V5h8v2"
                        />

                        <path
                            d="M9 11h6M9 15h4"
                        />

                    </svg>

                </span>

                <strong>My Orders</strong>

                <small>3</small>

            </button>



            <button
                class="stat-card"
                data-action="wishlist"
            >

                <span class="stat-icon">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M20.8 8.8c0 5.5-8.8 10.2-8.8 10.2S3.2 14.3 3.2 8.8A4.8 4.8 0 0112 6a4.8 4.8 0 018.8 2.8z"
                        />

                    </svg>

                </span>

                <strong>Wishlist</strong>

                <small>12</small>

            </button>



            <button
                class="stat-card"
                data-action="reviews"
            >

                <span class="stat-icon">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"
                        />

                    </svg>

                </span>

                <strong>Reviews</strong>

                <small>5</small>

            </button>



            <button
                class="stat-card"
                data-action="coupons"
            >

                <span class="stat-icon">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 7a2 2 0 002-2h12a2 2 0 002 2v3a2 2 0 010 4v3a2 2 0 00-2 2H6a2 2 0 00-2-2v-3a2 2 0 000-4z"
                        />

                        <path
                            d="M12 8v8"
                        />

                    </svg>

                </span>

                <strong>Coupons</strong>

                <small>2</small>

            </button>

        </section>



        <!-- =============================================
             TRACK ORDER
        ============================================== -->

        <section class="track-banner">


            <div class="track-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 6h11v10H3z"
                    />

                    <path
                        d="M14 9h4l3 3v4h-7z"
                    />

                    <circle
                        cx="7"
                        cy="18"
                        r="2"
                    />

                    <circle
                        cx="18"
                        cy="18"
                        r="2"
                    />

                </svg>

            </div>


            <div class="track-info">

                <h2>Track your order</h2>

                <p>
                    Check your order status in real time
                </p>

            </div>


            <div class="track-route">

                <span class="route-dot"></span>

                <span class="route-line"></span>

                <span class="route-pin">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"
                        />

                        <circle
                            cx="12"
                            cy="9"
                            r="2"
                        />

                    </svg>

                </span>

            </div>


            <button
                class="track-btn"
                id="trackBtn"
            >

                <span>Track Now</span>

                <svg viewBox="0 0 24 24">

                    <path d="M9 18l6-6-6-6"/>

                </svg>

            </button>

        </section>



        <!-- =============================================
             ACCOUNT MENU
        ============================================== -->

        <section class="menu-section">

            <h2 class="section-title">
                Account Menu
            </h2>


            <div class="menu-card">


                <!-- Orders -->

                <button
                    class="menu-item"
                    data-action="orders"
                >

                    <span class="menu-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M5 7h14v14H5z"
                            />

                            <path
                                d="M8 7V4h8v3"
                            />

                            <path
                                d="M9 12h6M9 16h4"
                            />

                        </svg>

                    </span>


                    <span class="menu-text">

                        <strong>My Orders</strong>

                        <small>
                            View your order history & details
                        </small>

                    </span>


                    <svg
                        class="menu-arrow"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 18l6-6-6-6"/>

                    </svg>

                </button>



                <!-- Address -->

                <button
                    class="menu-item"
                    data-action="addresses"
                >

                    <span class="menu-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"
                            />

                            <circle
                                cx="12"
                                cy="9"
                                r="2"
                            />

                        </svg>

                    </span>


                    <span class="menu-text">

                        <strong>Saved Addresses</strong>

                        <small>
                            Manage your delivery addresses
                        </small>

                    </span>


                    <svg
                        class="menu-arrow"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 18l6-6-6-6"/>

                    </svg>

                </button>



                <!-- Payment -->

                <button
                    class="menu-item"
                    data-action="payment"
                >

                    <span class="menu-icon">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            />

                            <path
                                d="M3 10h18M7 15h4"
                            />

                        </svg>

                    </span>


                    <span class="menu-text">

                        <strong>Payment Methods</strong>

                        <small>
                            Cards, mobile banking & more
                        </small>

                    </span>


                    <svg
                        class="menu-arrow"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 18l6-6-6-6"/>

                    </svg>

                </button>



                <!-- Notifications -->

                <button
                    class="menu-item"
                    data-action="notifications"
                >

                    <span class="menu-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M18 9a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                            />

                            <path
                                d="M10 21h4"
                            />

                        </svg>

                    </span>


                    <span class="menu-text">

                        <strong>Notifications</strong>

                        <small>
                            Order updates, offers & more
                        </small>

                    </span>


                    <svg
                        class="menu-arrow"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 18l6-6-6-6"/>

                    </svg>

                </button>



                <!-- Help -->

                <button
                    class="menu-item"
                    data-action="help"
                >

                    <span class="menu-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M4 13a8 8 0 0116 0v4a3 3 0 01-3 3h-2v-6h5"
                            />

                            <path
                                d="M4 14h5v6H7a3 3 0 01-3-3z"
                            />

                        </svg>

                    </span>


                    <span class="menu-text">

                        <strong>Help & Support</strong>

                        <small>
                            FAQs, contact us & more
                        </small>

                    </span>


                    <svg
                        class="menu-arrow"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 18l6-6-6-6"/>

                    </svg>

                </button>



                <!-- Privacy -->

                <button
                    class="menu-item"
                    data-action="privacy"
                >

                    <span class="menu-icon">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M12 3l8 3v5c0 5.2-3.4 8.8-8 10-4.6-1.2-8-4.8-8-10V6z"
                            />

                            <path
                                d="M9 12l2 2 4-4"
                            />

                        </svg>

                    </span>


                    <span class="menu-text">

                        <strong>Privacy & Security</strong>

                        <small>
                            Your data is safe with us
                        </small>

                    </span>


                    <svg
                        class="menu-arrow"
                        viewBox="0 0 24 24"
                    >

                        <path d="M9 18l6-6-6-6"/>

                    </svg>

                </button>


            </div>

        </section>



        <!-- =============================================
             SELLER BANNER
        ============================================== -->

        <section
            class="seller-banner"
            id="sellerBanner"
        >

            <div class="seller-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M4 10h16v10H4z"
                    />

                    <path
                        d="M3 10l2-5h14l2 5"
                    />

                    <path
                        d="M7 10v2a2 2 0 004 0v-2a2 2 0 004 0v-2"
                    />

                    <path
                        d="M9 20v-5h6v5"
                    />

                </svg>

            </div>


            <div class="seller-text">

                <strong>
                    Become a Seller
                </strong>

                <small>
                    Grow your business with BAZVOR
                </small>

            </div>


            <div class="seller-shop">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 10h18"
                    />

                    <path
                        d="M5 10v10h14V10"
                    />

                    <path
                        d="M4 10l2-6h12l2 6"
                    />

                    <path
                        d="M8 10v2a2 2 0 004 0v-2a2 2 0 004 0v-2"
                    />

                </svg>

            </div>


            <svg
                class="seller-arrow"
                viewBox="0 0 24 24"
            >

                <path d="M9 18l6-6-6-6"/>

            </svg>

        </section>



        <!-- =============================================
             LOGOUT
        ============================================== -->

        <button
            class="logout-btn"
            id="logoutBtn"
        >

            <span class="logout-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M10 5H5v14h5"
                    />

                    <path
                        d="M13 8l4 4-4 4"
                    />

                    <path
                        d="M17 12H8"
                    />

                </svg>

            </span>


            <span>
                Logout
            </span>


            <svg
                class="logout-arrow"
                viewBox="0 0 24 24"
            >

                <path d="M9 18l6-6-6-6"/>

            </svg>

        </button>


    </main>



    <!-- =================================================
         BOTTOM NAVIGATION
    ================================================== -->

    <nav class="bottom-nav">


        <a
            href="home.html"
            class="bottom-nav-item"
        >

            <span class="nav-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 10.5L12 3l9 7.5"
                    />

                    <path
                        d="M5 9v11h14V9"
                    />

                    <path
                        d="M9 20v-6h6v6"
                    />

                </svg>

            </span>

            <span>Home</span>

        </a>



        <a
            href="category.html"
            class="bottom-nav-item"
        >

            <span class="nav-icon grid-icon">

                <svg viewBox="0 0 24 24">

                    <rect x="4" y="4" width="6" height="6" rx="1"/>
                    <rect x="14" y="4" width="6" height="6" rx="1"/>
                    <rect x="4" y="14" width="6" height="6" rx="1"/>
                    <rect x="14" y="14" width="6" height="6" rx="1"/>

                </svg>

            </span>

            <span>Category</span>

        </a>



        <a
            href="message.html"
            class="bottom-nav-item"
        >

            <span class="nav-icon message-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M4 5h16v12H8l-4 4z"
                    />

                    <path
                        d="M8 10h8M8 14h5"
                    />

                </svg>

                <span class="nav-dot"></span>

            </span>

            <span>Message</span>

        </a>



        <a
            href="cart.html"
            class="bottom-nav-item"
        >

            <span class="nav-icon cart-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 4h2l2 12h11l3-9H6"
                    />

                    <circle
                        cx="10"
                        cy="20"
                        r="1.5"
                    />

                    <circle
                        cx="18"
                        cy="20"
                        r="1.5"
                    />

                </svg>

                <span class="cart-badge">
                    3
                </span>

            </span>

            <span>Cart</span>

        </a>



        <a
            href="account.html"
            class="bottom-nav-item active"
        >

            <span class="nav-icon">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="8"
                        r="4"
                    />

                    <path
                        d="M4 21a8 8 0 0116 0"
                    />

                </svg>

            </span>

            <span>Account</span>

        </a>


    </nav>


</div>



<!-- =====================================================
     EDIT PROFILE MODAL
====================================================== -->

<div
    class="modal-overlay"
    id="editModal"
>

    <div class="edit-modal">

        <button
            class="modal-close"
            id="modalClose"
        >
            ×
        </button>

        <h2>
            Edit Profile
        </h2>

        <p>
            Update your account information
        </p>


        <label>
            Name

            <input
                type="text"
                id="editName"
                value="Md Faruk Islam"
            >

        </label>


        <label>
            Phone

            <input
                type="tel"
                id="editPhone"
                value="+880 1712 345678"
            >

        </label>


        <label>
            Email

            <input
                type="email"
                id="editEmail"
                value="farukislam@gmail.com"
            >

        </label>


        <button
            class="save-profile-btn"
            id="saveProfileBtn"
        >
            Save Changes
        </button>

    </div>

</div>



<script src="account.js"></script>

</body>

</html>
